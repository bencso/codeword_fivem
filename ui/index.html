<!doctype html>
<html lang="hu">
  <head>
    <meta charset="UTF-8" />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Montserrat:wght@700;800&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <div id="codename_window">
      <!-- ========== LOBBY: még nincs belépve ========== -->
      <section id="codename_view-lobby" class="codename_view">
        <div class="codename_panel">
          <div class="codename_btn-row">
            <button id="codename_exitBtn" class="codename_btn">Kilépés</button>
            <button
              id="codename_joinBtn"
              class="codename_btn codename_btn-confirm"
            >
              Csatlakozás
            </button>
          </div>
        </div>
      </section>

      <!-- ========== VÁRAKOZÁS: belépett, indulásra vár ========== -->
      <section id="codename_view-waiting" class="codename_view">
        <div class="codename_panel">
          <header class="codename_panel-head codename_panel-head--split">
            <div>
              <h1 class="codename_title">Várakozás</h1>
              <p class="codename_subtitle">A játék hamarosan kezdődik</p>
            </div>
            <div
              class="codename_countdown hidden"
              id="codename_countdown-waiting"
            >
              30
            </div>
          </header>

          <ul class="codename_lobby-players" id="codename_lobbyPlayers"></ul>

          <div class="codename_btn-row codename_btn-row--single">
            <button
              id="codename_leaveBtn"
              class="codename_btn codename_btn-danger"
            >
              Kilépés a szobából
            </button>
          </div>
        </div>
      </section>

      <!-- ========== SPYMASTER VÁLASZTÁS ========== -->
      <section id="codename_view-team" class="codename_view">
        <div class="codename_panel">
          <header class="codename_panel-head codename_panel-head--split">
            <div>
              <h1 class="codename_title">Spymaster választás</h1>
            </div>
            <div class="codename_countdown hidden" id="codename_countdown-team">
              30
            </div>
          </header>

          <ul class="codename_lobby-players" id="codename_lobbyPlayers"></ul>

          <div class="codename_btn-row codename_btn-row--single">
            <button
              id="codename_pickSpymasterBtn"
              class="codename_btn codename_btn-confirm"
            >
              Leszek a spymaster
            </button>
          </div>
        </div>
      </section>

      <!-- ========== JÁTÉK ========== -->
      <section id="codename_view-game" class="codename_view">
        <div class="codename_stage">
          <aside class="codename_side codename_side-teamOne">
            <h2 class="codename_side-title">Csapat 1</h2>
            <ul class="codename_side-players" id="codename_teamOnePlayers"></ul>
          </aside>

          <main class="codename_board">
            <div class="codename_board-header">
              <div class="codename_clue hidden" id="codename_clueText"></div>
              <div class="codename_clue hidden" id="codename_clueCount"></div>
              <div class="codename_turn" id="codename_turnText">
                Csapat 1 köre
              </div>
              <div class="codename_turnTimer" id="codename_turnTimerText">
                60
              </div>
            </div>
            <div class="codename_grid" id="codename_grid"></div>

            <div id="codename_clueBar" class="hidden">
              <div class="codename_clue-bar">
                <input
                  id="codename_clueTextInput"
                  class="codename_clue-input"
                  type="text"
                  maxlength="24"
                  placeholder="Támpont…"
                  autocomplete="off"
                  spellcheck="false"
                />
                <input
                  id="codename_clueCountInput"
                  class="codename_clue-count empty"
                  value="0"
                />
                <button
                  id="codename_clueSubmit"
                  class="codename_btn codename_btn-confirm"
                  disabled
                >
                  Beküldés
                </button>
              </div>
              <p class="codename_clue-hint">
                Jelöld ki a kártyákat, amelyekre a megadott szó vonatkozik
              </p>
            </div>

            <div id="codename_playerBar" class="hidden">
              <div class="codename_clue-bar">
                <button
                  id="codename_nextRoundBtn"
                  class="codename_btn codename_btn-confirm"
                  disabled
                >
                  Skippelés / Következő kör
                </button>
              </div>
              <p class="codename_clue-hint">
                Jelöld ki a kártyákat, amelyekre a megadott szó vonatkozik
              </p>
            </div>
          </main>

          <aside class="codename_side codename_side-teamTwo">
            <h2 class="codename_side-title">Csapat 2</h2>
            <ul class="codename_side-players" id="codename_teamTwoPlayers"></ul>
          </aside>
        </div>
      </section>
    </div>

    <script src="../consts.js"></script>
    <script src="helper/post.js"></script>
    <script src="helper/uiHelper.js"></script>
    <script src="helper/countdown.js"></script>
    <script src="helper/refreshPlayerList.js"></script>
    <script src="helper/ingamePlayerList.js"></script>
    <script src="helper/createWordCards.js"></script>
    <script src="helper/clueInput.js"></script>
    <script src="helper/nextRoundBtn.js"></script>
    <script src="script.js"></script>
  </body>
</html>
