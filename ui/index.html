<!doctype html>
<html lang="hu">
  <head>
    <meta charset="UTF-8" />
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <div id="codename_window">
      <!-- ========== LOBBY még nincs belépve ========== -->
      <section id="codename_view-lobby" class="codename_view">
        <div class="codename_panel">
          <div class="codename_btn-stack">
            <button
              id="codename_joinBtn"
              class="codename_btn codename_btn-ghost"
            >
              Csatlakozás
            </button>
            <button
              id="codename_exitBtn"
              class="codename_btn codename_btn-ghost"
            >
              Kilépés
            </button>
          </div>
        </div>
      </section>

      <!-- ========== WAITING ROOM belépes után, várakozásra ========== -->
      <section id="codename_view-waiting" class="codename_view">
        <div class="codename_panel">
          <div
            class="codename_countdown hidden"
            id="codename_countdown-waiting"
          >
            <span id="codename_countdownNum">30</span>
          </div>

          <ul class="codename_lobby-players" id="codename_lobbyPlayers"></ul>

          <button
            id="codename_leaveBtn"
            class="codename_btn codename_btn-danger"
          >
            Kilépés a szobából
          </button>
        </div>
      </section>

      <!-- ========== SPYMASTER SELECTION ROOM  ========== -->
      <section id="codename_view-team" class="codename_view">
        <div class="codename_panel">
          <div class="codename_countdown hidden" id="codename_countdown-team">
            <span id="codename_countdownNum">30</span>
          </div>

          <ul class="codename_lobby-players" id="codename_lobbyPlayers"></ul>

          <button
            id="codename_pickSpymasterBtn"
            class="codename_btn codename_btn-danger"
          >
            Leszek Spymaster
          </button>
        </div>
      </section>

      <!-- ========== JÁTÉK ========== -->
      <section id="codename_view-game" class="codename_view">
        <div class="codename_stage">
          <aside class="codename_side codename_side-teamOne">
            <h2>Csapat 1</h2>
            <ul class="codename_side-players" id="codename_teamOnePlayers"></ul>
          </aside>

          <main class="codename_board">
            <div class="codename_turn" id="codename_turnText">
              Csapat 1 következik
            </div>
            <div class="codename_grid" id="codename_grid"></div>
          </main>

          <aside class="codename_side codename_side-teamTwo">
            <h2>Csapat 2</h2>
            <ul class="codename_side-players" id="codename_teamTwoPlayers"></ul>
          </aside>
        </div>
      </section>
    </div>

    <script src="../consts.js"></script>
    <script src="./helper/countdown.js"></script>
    <script src="./helper/post.js"></script>
    <script src="./helper/refreshPlayerList.js"></script>
    <script src="./helper/uiHelper.js"></script>
    <script src="script.js"></script>
  </body>
</html>
