<!doctype html>
<html lang="hu">
  <head>
    <meta charset="UTF-8" />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Montserrat:wght@700;800&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <div id="codeword_window">
      <!-- ========== LOBBY: még nincs belépve ========== -->
      <section id="codeword_view-lobby" class="codeword_view">
        <div class="codeword_panel">
          <div class="codeword_btn-row">
            <button id="codeword_exitBtn" class="codeword_btn">Kilépés</button>
            <button
              id="codeword_joinBtn"
              class="codeword_btn codeword_btn-confirm"
            >
              Csatlakozás
            </button>
          </div>
        </div>
      </section>

      <!-- ========== VÁRAKOZÁS: belépett, indulásra vár ========== -->
      <section id="codeword_view-waiting" class="codeword_view">
        <div class="codeword_panel">
          <header class="codeword_panel-head codeword_panel-head--split">
            <div>
              <h1 class="codeword_title">Várakozás</h1>
              <p class="codeword_subtitle">A játék hamarosan kezdődik</p>
            </div>
            <div
              class="codeword_countdown hidden"
              id="codeword_countdown-waiting"
            >
              30
            </div>
          </header>

          <ul class="codeword_lobby-players"></ul>

          <div class="codeword_btn-row codeword_btn-row--single">
            <button
              id="codeword_leaveBtn"
              class="codeword_btn codeword_btn-danger"
            >
              Kilépés a szobából
            </button>
          </div>
        </div>
      </section>

      <!-- ========== SPYMASTER VÁLASZTÁS ========== -->
      <section id="codeword_view-team" class="codeword_view">
        <div class="codeword_panel">
          <header class="codeword_panel-head codeword_panel-head--split">
            <h1 class="codeword_title">Spymaster választás</h1>
            <div class="codeword_countdown hidden" id="codeword_countdown-team">
              30
            </div>
          </header>

          <ul class="codeword_lobby-players"></ul>

          <div class="codeword_btn-row codeword_btn-row--single">
            <button
              id="codeword_pickSpymasterBtn"
              class="codeword_btn codeword_btn-confirm"
            >
              Leszek a spymaster
            </button>
          </div>
        </div>
      </section>

      <!-- ========== JÁTÉK ========== -->
      <section id="codeword_view-game" class="codeword_view">
        <div class="codeword_stage">
          <aside class="codeword_side codeword_side-teamOne">
            <h2 class="codeword_side-title">Csapat 1</h2>
            <ul class="codeword_side-players" id="codeword_teamOnePlayers"></ul>

            <ul class="codeword_clue-history" id="codeword_teamOneClues"></ul>
          </aside>

          <main class="codeword_board">
            <div class="codeword_board-header">
              <div class="codeword_clue hidden" id="codeword_clueText"></div>
              <div class="codeword_clue hidden" id="codeword_clueCount"></div>
              <div class="codeword_turn" id="codeword_turnText">
                Csapat 1 köre
              </div>
              <div class="codeword_turnTimer" id="codeword_turnTimerText">
                60
              </div>
            </div>
            <div class="codeword_grid" id="codeword_grid"></div>

            <div id="codeword_clueBar" class="hidden">
              <div class="codeword_clue-bar">
                <input
                  id="codeword_clueTextInput"
                  class="codeword_clue-input"
                  type="text"
                  maxlength="24"
                  placeholder="Támpont…"
                  autocomplete="off"
                  spellcheck="false"
                />
                <input
                  id="codeword_clueCountInput"
                  class="codeword_clue-count empty"
                  value="0"
                />
                <button
                  id="codeword_clueSubmit"
                  class="codeword_btn codeword_btn-confirm"
                  disabled
                >
                  Beküldés
                </button>
              </div>
              <p class="codeword_clue-hint" id="codeword_clueHint">
                Jelöld ki a kártyákat, amelyekre a megadott szó vonatkozik
              </p>
            </div>

            <div id="codeword_playerBar" class="hidden">
              <div class="codeword_clue-bar">
                <button
                  id="codeword_nextRoundBtn"
                  class="codeword_btn codeword_btn-confirm"
                  disabled
                >
                  Skippelés / Következő kör
                  <span id="codeword_nextRoundBtn_count"></span>
                </button>
              </div>
              <p class="codeword_clue-hint"></p>
            </div>
          </main>

          <aside class="codeword_side codeword_side-teamTwo">
            <h2 class="codeword_side-title">Csapat 2</h2>
            <ul class="codeword_side-players" id="codeword_teamTwoPlayers"></ul>

            <ul class="codeword_clue-history" id="codeword_teamTwoClues"></ul>
          </aside>
        </div>
      </section>

      <div id="codeword_roundBanner" class="codeword_roundBanner"></div>
    </div>
    <script src="../locale.js"></script>
    <script src="../consts.js"></script>
    <script src="helper/post.js"></script>
    <script src="helper/uiHelper.js"></script>
    <script src="helper/countdown.js"></script>
    <script src="helper/refreshPlayerList.js"></script>
    <script src="helper/ingamePlayerList.js"></script>
    <script src="helper/modifyWordCards.js"></script>
    <script src="helper/modifyClueHistory.js"></script>
    <script src="helper/clueInput.js"></script>
    <script src="helper/nextRoundBtn.js"></script>
    <script src="script.js"></script>
  </body>
</html>
